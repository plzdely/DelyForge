# Local development services for DelyForge Cloud.
# Start with: pnpm db:up   (requires Docker Desktop to be running)
services:
  postgres:
    image: postgres:17-alpine
    container_name: delyforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delyforge
      POSTGRES_PASSWORD: delyforge_dev_only
      POSTGRES_DB: delyforge
    ports:
      - "5433:5432"
    volumes:
      - delyforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delyforge -d delyforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  delyforge-pgdata:
